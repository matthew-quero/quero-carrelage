<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quéro — Aperçu responsive</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e8e6;font:14px Arial,sans-serif}header{position:sticky;top:0;z-index:2;padding:14px 20px;background:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ccc}button,a{font:inherit;color:#111;padding:10px 14px;background:#fff;border:1px solid #bbb;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#111;color:#fff}main{padding:24px;overflow:auto;display:flex;justify-content:center}iframe{border:0;background:#fff;box-shadow:0 4px 30px #0002;flex:none}output{margin-left:auto}</style></head><body><header><strong>Quéro · Aperçu responsive</strong><button data-size="375,812" aria-pressed="false">375 px</button><button data-size="390,844" aria-pressed="true">390 px</button><button data-size="768,1024" aria-pressed="false">Tablette</button><button data-size="1024,768" aria-pressed="false">Paysage</button><a href="./index.html">Site ↗</a><output>390 × 844</output></header><main><iframe title="Site Quéro Carrelage aux dimensions sélectionnées" src="./index.html?preview=hero-middle" width="390" height="844"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const f=document.querySelector('iframe');f.width=w;f.height=h;document.querySelector('output').textContent=w+' × '+h;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});</script></body></html>
